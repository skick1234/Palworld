name: Bug report
description: Report a reproducible problem with PalLaw, PalOps, or the public website.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project. Please use the Discord support link for setup questions and general troubleshooting.

        Remove passwords, tokens, Authorization headers, public IP addresses, player identifiers, and other private server data before attaching configuration or logs.

  - type: dropdown
    id: product
    attributes:
      label: Affected product
      description: Choose the mod or public tool where the problem appears.
      options:
        - PalLaw
        - PalOps
        - Public website
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Choose the part of the selected product where the problem appears.
      options:
        - Native mod or server behavior
        - Installation or packaging
        - Configuration loading or validation
        - HTTP API
        - Web editor or dashboard
        - Website or documentation
        - Other
    validations:
      required: true

  - type: input
    id: product-version
    attributes:
      label: Product version
      description: Use the PalLaw or PalOps release version, a commit when built from source, or "Current website."
      placeholder: "Example: 0.3.0, commit 1a2b3c4, or Current website"
    validations:
      required: true

  - type: input
    id: palworld-version
    attributes:
      label: Palworld server version
      description: Include the dedicated server version for native mod or API problems. Otherwise enter "Not applicable."
      placeholder: "Example: 0.6.4.75345, or Not applicable"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the server OS and host type, or the browser, operating system, and device for web problems.
      placeholder: "Example: Windows Server 2022, self-hosted; or Firefox 142 on Windows 11"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem, including any visible error, status code, broken behavior, or incorrect result.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that causes the problem.
      placeholder: |
        1. Start with ...
        2. Change or open ...
        3. Perform ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration or request
      description: Paste only the smallest sanitized configuration fragment, endpoint, request, or response needed to reproduce the problem.
      render: text

  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Attach screenshots or paste relevant sanitized UE4SS, server, dashboard, validation, or browser-console output.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find the same problem.
          required: true
        - label: I removed credentials, IP addresses, and other private server or player data.
          required: true
