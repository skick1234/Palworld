name: Deploy public tools to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "apps/legal/**"
      - "apps/pallaw/**"
      - "apps/shared/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "vite.config.ts"
      - "tools/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Stamp static asset cache keys
        run: bun tools/stamp-site-cache.mjs
      - name: Typecheck static site
        run: bun run typecheck
      - name: Test static site
        run: bun run test
      - name: Build static site
        run: bun run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
